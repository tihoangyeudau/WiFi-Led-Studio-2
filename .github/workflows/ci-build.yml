name: CI Build Wls

on:
  push:
  pull_request:

jobs:
  build-wls-windows:
    name: Build Wls (Windows)
    runs-on: windows-latest
    strategy:
      matrix:
        python: ["3.12"]
    steps:
      - name: Check out code from GitHub
        uses: actions/checkout@v4
      - name: Setup Python ${{ matrix.python }}
        id: python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build a binary wheel
        run: |
          python -m pip install -U pip wheel setuptools
          python setup.py bdist_wheel
      - name: Install Wls
        run: |
          pip install --pre --find-links=dist .
      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wls-windows-py${{ matrix.python }}
          path: dist/*.whl
          if-no-files-found: error

  build-wls-osx:
    name: Build Wls (macOS)
    runs-on: macos-latest
    strategy:
      matrix:
        python: ["3.13"]
    steps:
      - name: Check out code from GitHub
        uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          brew install portaudio aubio
      - name: Setup Python ${{ matrix.python }}
        id: python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build a binary wheel
        run: |
          python -m pip install -U pip wheel setuptools
          python setup.py bdist_wheel
      - name: Install Wls
        env:
          # aubio 0.4.9 declares ufunc callbacks without const, which recent
          # clang rejects as an error
          CFLAGS: -Wno-error=incompatible-function-pointer-types
        run: |
          pip install --pre --find-links=dist .
      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wls-macos-py${{ matrix.python }}
          path: dist/*.whl
          if-no-files-found: error
