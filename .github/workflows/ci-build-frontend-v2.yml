name: CI Build Wls Frontend v2

on:
  push:
    branches:
      - frontend_beta
  pull_request:
    branches:
      - frontend_beta

jobs:
  build-wls-frontend-v2:
    name: Build Wls Frontend
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [14, 16]
    steps:
      - name: Check out code from GitHub
        uses: actions/checkout@v2
        with:
          repository: YeonV/Wls-Frontend-v2
          ref: main
          # path: wls-frontend-v2
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v2
        with:
          node-version: ${{ matrix.node-version }}
          cache: yarn
      - name: Run yarn install and build
        run: |
          yarn
          yarn buildgh
        env:
          CI: true


